# Canonical dev==CI stack (ADR-0001). Repo root so `-f docker-compose.yml` and the harness
# override (tests/harness/compose.test.yml) both resolve here. Brings up:
#   postgres -> migrate (preflight + chain) -> brain (singleton + mTLS + health) -> box(es)
#   + smtp-sink (Mailpit). Least-privilege secret mounts: the box mounts ONLY its own mTLS
#   leaf; the Brain alone mounts the KMS key; the sink mounts only its own leaf.
name: sender-module

x-pg-env: &pg-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_SUPERPASS:-devsuperpass}
  POSTGRES_DB: platform

services:
  postgres:
    image: postgres:16-alpine
    environment: *pg-env
    ports: ["5432:5432"]
    volumes:
      # Dev-only fixture tables for public.users / public.job_items so the preflight passes
      # locally (clearly NOT the real platform schema — see deploy/pg-init).
      - ./deploy/pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: preflight (public.users + public.job_items exist?) then apply sender_NNNN in
  # ascending order (self-recording). Runs as an admin/owner-capable role (OD-1). Exits 0.
  migrate:
    build: { context: ., dockerfile: tools/sender-migrate/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      MIGRATE_DATABASE_URL: postgres://postgres:${POSTGRES_SUPERPASS:-devsuperpass}@postgres:5432/platform
      MIGRATIONS_DIR: /db/migrations
      PREFLIGHT_SQL: /db/preflight/check_platform_tables.sql
      # After the bootstrap creates sender_module, set its password out-of-band (never in SQL).
      SENDER_MODULE_PASSWORD: ${SENDER_MODULE_PASSWORD:-devmodulepass}
    volumes:
      - ./db:/db:ro
    command: ["up-and-set-password"]
    restart: "no"

  brain:
    build: { context: ., dockerfile: services/brain/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    environment:
      # Brain connects as the module role, NOT superuser.
      DATABASE_URL: postgres://sender_module:${SENDER_MODULE_PASSWORD:-devmodulepass}@postgres:5432/platform
      BRAIN_SINGLETON_ACQUIRE_TIMEOUT_SEC: "60"
      BRAIN_HEALTH_ADDR: ":8080"
      BRAIN_BOXLINK_ADDR: ":8443"
      KMS_DEV_KEY_FILE: /secrets/kms/dev-master.key       # Brain is SOLE decryptor
      MTLS_SERVER_CERT: /secrets/mtls/brain.crt
      MTLS_SERVER_KEY:  /secrets/mtls/brain.key
      MTLS_CA_CERT:     /secrets/mtls/ca.crt
      DEV_BOX_ID: ${DEV_BOX_ID:-dev-box-1}
      DEV_BOX_TOKEN_HASH: ${DEV_BOX_TOKEN_HASH:?set DEV_BOX_TOKEN_HASH in .env (provision-box)}
    volumes:
      # LEAST-PRIVILEGE: Brain is the ONLY service that mounts the kms/ subtree (sole
      # decryptor). It also gets its own mTLS server leaf + the CA. Never box.key.
      - ./secrets/dev/kms/dev-master.key:/secrets/kms/dev-master.key:ro
      - ./secrets/dev/certs/brain.crt:/secrets/mtls/brain.crt:ro
      - ./secrets/dev/certs/brain.key:/secrets/mtls/brain.key:ro
      - ./secrets/dev/certs/ca.crt:/secrets/mtls/ca.crt:ro
    ports:
      - "8080:8080"     # health/ready
      - "8443:8443"     # boxlink mTLS
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/readyz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  box:
    build: { context: ., dockerfile: services/box/Dockerfile }
    depends_on:
      brain: { condition: service_healthy }
    environment:
      BRAIN_HOST: brain
      BRAIN_BOXLINK_PORT: "8443"
      BRAIN_SERVER_NAME: brain
      BOX_ID: ${DEV_BOX_ID:-dev-box-1}
      BOX_TOKEN: ${DEV_BOX_TOKEN:?set DEV_BOX_TOKEN in .env (provision-box)}
      BOX_HEARTBEAT_INTERVAL_SEC: "10"
      MTLS_CLIENT_CERT: /secrets/mtls/box.crt
      MTLS_CLIENT_KEY:  /secrets/mtls/box.key
      MTLS_CA_CERT:     /secrets/mtls/ca.crt
      # NOTE: no DATABASE_URL, no KMS key — box has neither by construction.
    volumes:
      # LEAST-PRIVILEGE: ONLY the box's own mTLS leaf + CA. Never the kms/ subtree, never
      # brain.key/ca.key. A harness test asserts the box cannot read any KMS material.
      - ./secrets/dev/certs/box.crt:/secrets/mtls/box.crt:ro
      - ./secrets/dev/certs/box.key:/secrets/mtls/box.key:ro
      - ./secrets/dev/certs/ca.crt:/secrets/mtls/ca.crt:ro
    # no host port -> scale freely: docker compose up --scale box=N

  smtp-sink:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ALLOW_INSECURE: "false"
      MP_SMTP_REQUIRE_STARTTLS: "true"     # force STARTTLS so the TLS path is really tested
      MP_SMTP_TLS_CERT: /certs/sink.crt
      MP_SMTP_TLS_KEY:  /certs/sink.key
    volumes:
      # LEAST-PRIVILEGE: sink presents its OWN server leaf only. Never ca.key/brain.key.
      - ./secrets/dev/certs/sink.crt:/certs/sink.crt:ro
      - ./secrets/dev/certs/sink.key:/certs/sink.key:ro
    ports:
      - "8025:8025"     # Mailpit web UI
      # 1025/587 stay internal to the compose network
