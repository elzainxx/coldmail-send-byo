# TEMPORARY (branch copy-ledger-2 only; removed before merge): fast feedback for the user-copy ledger gate, which needs only Go.
name: copy-ledger-quick
on:
  push:
    branches: ["copy-ledger-2"]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gofmt + vet the packages this change touches
        run: |
          test -z "$(gofmt -l services/control)" || { gofmt -l services/control; exit 1; }
          (cd services/control && go vet ./internal/copyledger/ ./internal/fromgate/ ./internal/dispatch/ ./internal/platformapi/ ./internal/adminapi/)
      - name: The ledger gate (real tree)
        run: bash tests/harness/checks/user_copy_ledger.sh
      - name: The ledger gate's paired control (six breaks)
        run: bash tests/harness/checks/user_copy_ledger_selftest.sh
