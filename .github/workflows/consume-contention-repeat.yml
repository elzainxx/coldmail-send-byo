# FW-M3-22 — the REPEAT proof for the daily-limit ceiling test.
#
# TestAccountConsume_NeverExceedsDailyLimit_ConcurrentLanes guards the double-booking ceiling and failed once (run 43445719147)
# for a reason that had nothing to do with the code under test: its proof that the race was real was decided by scheduling.
# It now FORCES the contention (consume_contention_test.go). "It no longer flakes" is a claim about many runs, so this workflow
# runs the test N times (default 50) against the real code on a runner and requires N passes, zero failures, and N lines of
# forced-contention evidence. One failure in 50 is a failed workflow.
#
# Run it by hand:  gh workflow run consume-contention-repeat.yml -R elzainxx/coldmail-send-byo -f count=50
#
# The single-run gate and its six mutants (the paired controls that prove each test goes red without the property) are in
# real-infra.yml: tests/harness/checks/consume_contention.sh and consume_contention_selftest.sh.
name: consume-contention-repeat
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many times to run TestAccountConsume_NeverExceedsDailyLimit_ConcurrentLanes"
        required: false
        default: "50"

# DISPATCH-ONLY, and it stays that way: a 50-run proof is started by hand, so there is no push/pull-request trigger to filter.

# Least privilege: this workflow only reads the repository (checkout). It reads no secret and writes nothing back.
permissions:
  contents: read

# Queued, never cancelled: this is an evidence run (N passes or the workflow is red). A second dispatch, for example a quick smoke run with a
# small count, must not cancel a 50-run proof that is half way done. Nothing triggers it automatically, so there is no pile-up to economise.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repeat:
    runs-on: ubuntu-latest
    env:
      DEV_RAM_PG: "1"
    steps:
      # Every third-party action is pinned to a full commit SHA (the tag is a comment for the reader; the SHA is what runs).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: Generate dev secrets (writes .env, which the compose file reads)
        run: bash scripts/dev.sh certs

      - name: Bring up Postgres only (the test needs a database, not the stack)
        run: $(bash scripts/dev.sh compose) up -d --wait postgres

      # The dispatch input reaches the shell through an environment variable, never by being spliced into the script text: a workflow input
      # interpolated straight into `run:` is a script-injection point (the one place in this repository where user-typed text meets a shell).
      - name: Run the test N times — zero failures, N evidence lines
        env:
          REPEAT_COUNT: ${{ inputs.count || '50' }}
        run: bash tests/harness/checks/consume_contention.sh --repeat "$REPEAT_COUNT"
