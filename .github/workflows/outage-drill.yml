# On-demand: the full harness in the DEFAULT (volume-backed, non-RAM) Postgres mode, then the real `docker stop postgres` outage drill.
#
#   gh workflow run outage-drill.yml -R elzainxx/coldmail-send-byo
#
# Why a separate workflow and not a step in real-infra.yml: the per-push CI deliberately runs the RAM-backed Postgres (DEV_RAM_PG=1)
# for speed, and a RAM-backed Postgres cannot be outage-drilled — `docker stop` destroys the database. This runs the OTHER mode, where
# the data lives in a volume, so (1) the whole harness is proven in that mode too (it had never been run for this module), and (2) the
# drill (tests/harness/drills/postgres_outage.sh — Docs/install-and-deploy.md#acceptance-sequence-module-3 Stage 9.10) can stop and start the real
# database with a job genuinely in flight and check that the Control halts cleanly and INVENTS NOTHING. It runs on a runner, not on a
# developer machine, because the result that counts is the one on the real runner — and because the local VM cannot hold it.
name: outage-drill

# DISPATCH-ONLY, and it stays that way: this is an on-demand proof, not a per-push gate (see the header), so the push/pull-request
# trigger economy that real-infra.yml applies has nothing to filter here.
on: workflow_dispatch

# Least privilege: this workflow only reads the repository (checkout). It reads no secret and writes nothing back.
permissions:
  contents: read

# Queued, never cancelled: a drill is started by hand on purpose and its result is the evidence. Nothing triggers it automatically, so
# there is no pile-up for cancelling to economise, and a second dispatch must not silently destroy a run that is half way to a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  default-mode:
    runs-on: ubuntu-latest
    # NO `env: DEV_RAM_PG` on purpose — that is the whole point of this workflow.
    steps:
      # Every third-party action is pinned to a full commit SHA (the tag is a comment for the reader; the SHA is what runs).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Build the migrate runner (M3-P0-OD-12 — required by three template-DB steps in run.sh)
        run: (cd tools/send-byo-migrate && go build -o bin/send-byo-migrate .)

      - name: Generate dev certs/secrets + provision dev worker (writes .env)
        run: bash scripts/dev.sh certs

      - name: Bring up the stack in the seeded order (postgres -> migrate -> seed -> rest), DEFAULT mode
        run: bash scripts/dev.sh reset

      - name: Postgres is volume-backed in this mode (the precondition of everything below)
        run: bash tests/harness/checks/postgres_durability.sh

      - name: Real-infra behavioral harness in the DEFAULT (non-RAM) mode
        run: bash scripts/dev.sh test

      # `dev.sh up` first: earlier harness suites deliberately stop and restart containers, and the drill needs control + worker running.
      - name: Postgres outage drill — the Control halts cleanly and invents nothing
        if: always()
        run: bash scripts/dev.sh up && bash tests/harness/drills/postgres_outage.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml ps -a || true
          docker compose -f docker-compose.yml logs --tail 120 control worker || true

      - name: Tear down
        if: always()
        run: bash scripts/dev.sh down || true
