# Real-infra CI (Phase 0). Runs on pushes to main, on pull requests and on version tags, EXCEPT for documentation-only changes
# (see the trigger comment below); a passing run is a REQUIRED status check
# on the default branch. Brings up the SAME compose stack devs run (base + harness override),
# executes the real-infra behavioral harness, then every BLOCKING structural gate. Nothing
# is mocked — real Postgres + real Control + real worker + real Mailpit (CLAUDE.md Rule 3).
#
# NO COUNT IS WRITTEN HERE ON PURPOSE. This line used to say "the seven BLOCKING structural gates"
# and was still saying seven when there were ten — a hand-maintained number that nothing verifies is
# the STALE ASSERTION class, and it reads as coverage while being wrong. The authoritative count is
# derived, not written: tests/harness/checks/test_enumeration.sh rule 2 fails unless every
# checks/*.sh is named in a run: command in this file, and prints the live number when it passes.
name: real-infra

# TRIGGERS (public-repository trigger economy). This is the heavy workflow (the whole compose stack, the behavioural harness and every
# blocking gate), so it runs on: pushes to main, pull requests, version tags, and by hand. It does NOT run for a change that touches
# ONLY prose documentation. Path filters are not applied to tag pushes, so a v* tag always runs the full gate.
#
# THE FILTER IS AN IGNORE LIST, NOT AN ALLOW LIST, ON PURPOSE: a file this list does not name still triggers the run. A new document
# therefore errs toward running CI, and only a deliberate edit here can skip it. Every document that a gate READS is deliberately
# absent from the list, so a docs-only change to it still runs the gate that parses it:
#   Docs/api-contract.md         contract_drift.sh (route and error-code tables)
#   Docs/config-reference.md     config_drift.sh, config_consumption.sh (the config-key reference and its RESERVED markers)
#   Docs/install-and-deploy.md   drain_grace.sh (the systemd TimeoutStopSec)
#   Docs/user-facing-copy.md     user_copy_ledger.sh and the copyledger Go test (the audit document)
# The .txt ledgers and manifests under Docs/ (config-manifest, config-consumers, current-phase, user-copy-strings, user-output-readers)
# are not .md, so they are not ignored either. If a gate starts reading another .md, it must not be added to this list.
#
# A REQUIRED-CHECK CAVEAT (stated here because a skipped workflow does not read as green): when a pull request touches only ignored
# files, this workflow creates NO check run at all. If branch protection later requires the `behavioral` check, such a pull request
# shows that check as "Expected" and cannot merge until the requirement is relaxed for it or a trivial non-ignored change is added.
# Today no branch protection exists on this repository (the API refuses it while the repository is private).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - "NOTICE"
      - "Docs/README.md"
      - "Docs/architecture.md"
      - "Docs/future-work.md"
      - "Docs/go-live-checklist.md"
      - "Docs/open-decisions.md"
      - "Docs/operator-runbook.md"
      - "Docs/security-posture.md"
      - "Docs/adr/**"
      - "Docs/history/**"
  # The same list as above, written out (no YAML anchor: keep the file readable by every tool that parses it).
  pull_request:
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - "NOTICE"
      - "Docs/README.md"
      - "Docs/architecture.md"
      - "Docs/future-work.md"
      - "Docs/go-live-checklist.md"
      - "Docs/open-decisions.md"
      - "Docs/operator-runbook.md"
      - "Docs/security-posture.md"
      - "Docs/adr/**"
      - "Docs/history/**"
  workflow_dispatch:

# Least privilege: this workflow only reads the repository (checkout). It reads no secret and writes nothing back.
permissions:
  contents: read

# A newer push or pull-request update to the same ref supersedes the run in flight: the older run's verdict is obsolete the moment the
# newer commit exists, and a runner minute is a runner minute. (A run that must finish no matter what would be exempt; none here.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavioral:
    runs-on: ubuntu-latest
    # #131: the RAM-backed, fsync-off Postgres (tests/harness/compose.test.yml) is OPT-IN in scripts/dev.sh
    # because it makes `docker stop postgres` destroy the database. CI stops nothing, so it opts in for
    # speed. Every `dev.sh` call below — and every check script, which now takes its compose invocation
    # from `dev.sh compose` — inherits this, so CI runs the same stack it always did.
    env:
      DEV_RAM_PG: "1"
    steps:
      # Every third-party action is pinned to a full commit SHA (the tag is a comment for the reader; the SHA is what runs).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      # The host-side Node tests (the worker unit suite and the harness's mTLS/variation tests) must run on the runtime the
      # worker SHIPS on — services/worker/Dockerfile is `node:24-alpine` — not on whatever Node the runner image happens to
      # carry that month. An unpinned toolchain is a hidden variable: it is how `node --test "glob"` (Node >= 21 only) went
      # unnoticed until a Node 20 environment ran it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Go lint — gofmt + vet (BLOCKING; keeps code/format from drifting)
        run: |
          test -z "$(gofmt -l services/control tools/send-byo-migrate tools/provision-worker tests/harness)" \
            || { echo 'gofmt: files need formatting:'; gofmt -l services/control tools/send-byo-migrate tools/provision-worker tests/harness; exit 1; }
          (cd services/control && go vet ./...)
          (cd tools/send-byo-migrate && go vet ./...)
          (cd tools/provision-worker && go vet ./...)
          (cd tests/harness && go vet ./...)

      - name: Build the migrate runner (M3-P0-OD-12 — required by three template-DB steps in run.sh)
        run: (cd tools/send-byo-migrate && go build -o bin/send-byo-migrate .)

      - name: Generate dev certs/secrets + provision dev worker (writes .env)
        run: bash scripts/dev.sh certs

      # `reset`, NOT `up`. THE ORDER IS LOAD-BEARING: postgres -> migrate (send_byo.boxes must EXIST)
      # -> seed the box token rows -> everything else. `up` skips the seed, and the worker's only
      # depends_on is `control: service_healthy`, so on a cold volume it registers before
      # send_byo.boxes carries its token_hash, is rejected as unauthenticated, burns its retry budget
      # and EXITS. It has no restart policy, so nothing brings it back — and `docker compose up
      # --wait` still returns 0, because the worker has no healthcheck for --wait to block on. The
      # stack reports success with a dead worker in it.
      #
      # MEASURED on this repo 2026-08-07, running exactly what this workflow said: after
      # `certs -> up`, `dev.sh up` EXITED 0 and `docker inspect` reported the worker
      # `running=false RestartCount=0 exit=1`, with the log naming the cause ("register rejected:
      # unauthenticated" then "could not (re)register within the retry budget; exiting").
      #
      # WHAT THIS DID *NOT* DO IS TURN THE HARNESS RED, AND THAT IS WHY IT SURVIVED. run.sh SUITE 3
      # seeds send_byo.boxes and runs `up -d --no-deps worker` itself (a fix made for that suite's own
      # sake), so the dead worker is resurrected mid-run and the unseeded stack still scored
      # **100 passed, 0 failed** end to end. Module 2, whose harness has no such self-heal, scored
      # 58/4 on the same defect. So in THIS repo the defect was invisible in the verdict: every suite
      # before SUITE 3 ran against a dead worker and happened not to need it, and nothing reported
      # that the stack it was handed was broken. A green whose premise was never checked is the thing
      # the step below exists to make impossible.
      #
      # scripts/dev.sh's `reset` case has documented this the whole time — "seeding after `up` is too
      # late, because the worker has already burned its retry budget and exited" — and this workflow
      # called `up` anyway. A comment in one file is not a control over another. CI now invokes the
      # recipe that encodes the ordering instead of re-implementing a subset of it.
      - name: Bring up the stack in the seeded order (postgres -> migrate -> seed -> rest)
        run: bash scripts/dev.sh reset

      # ANTI-VACUITY for the step above, guarding a real blind spot: `dev.sh up` returns 0 with a DEAD
      # worker (no healthcheck on the worker service — verified: `docker inspect` reports NO HEALTHCHECK
      # CONFIGURED, so `--wait` has nothing to block on and treats "started" as satisfied). "The stack
      # came up" is therefore not evidence a worker exists to test.
      #
      # IT ASSERTS ON THE LOG, NOT ON CONTAINER STATE, AND THAT IS THE WHOLE POINT. The obvious version
      # of this check — `running=true` and `RestartCount=0` — IS FLAKY, and flaky in the direction that
      # matters: it passes on the broken stack. The worker connects and is rejected ~1s AFTER start
      # (services/worker/src/index.js: register-reject calls stop() immediately; the 30-attempt budget
      # bounds only NETWORK errors), so `up` can return while it is still alive-but-not-yet-rejected.
      #
      # MEASURED 2026-08-07, four consecutive unseeded runs, sampling the instant `up` returned:
      #   attempt 1: running=true  RestartCount=0  -> the state check PASSES on a doomed worker
      #   attempt 2: running=false RestartCount=0  -> fails
      #   attempt 3: running=false RestartCount=0  -> fails
      #   attempt 4: running=false RestartCount=0  -> fails
      # One in four is a false green, and it is not a hypothetical: the first full unseeded run of this
      # workflow scored `worker BEFORE harness: running=true exit=0` and the harness went on to report
      # 100/0, on a stack where the worker log shows a register rejection and an exit. A one-in-four
      # false green on the control for a defect is worse than no control, because it reads as coverage.
      #
      # The log lines are terminal and monotonic — once "registered over mTLS stream" or "could not
      # (re)register within the retry budget" is emitted it stays in the log — so waiting for one of the
      # two removes the sampling race entirely instead of papering over it with a sleep. `register
      # rejections == 0` is what makes the seeded ORDER (not merely eventual liveness) the property
      # under test: run.sh SUITE 3 re-seeds and restarts the worker itself, so a late-seeded worker
      # still ends up registered, and a check that only asked "is it up now" would pass on the defect.
      - name: Worker came up seeded on the FIRST attempt (no register-reject exit)
        run: |
          DC="docker compose -f docker-compose.yml -f tests/harness/compose.test.yml"
          registered=0
          for _ in $(seq 1 30); do
            if $DC logs worker 2>&1 | grep -q "registered over mTLS stream"; then registered=1; break; fi
            if $DC logs worker 2>&1 | grep -q "could not (re)register within the retry budget"; then break; fi
            sleep 1
          done
          rc="$(docker inspect -f '{{.RestartCount}}' coldmail-send-byo-worker-1)"
          running="$(docker inspect -f '{{.State.Running}}' coldmail-send-byo-worker-1)"
          # `grep -c` prints 0 but EXITS 1 when nothing matches, and a GitHub step is `bash -e` (no pipefail): without the `|| true`
          # this assignment silently killed the step on exactly the HEALTHY path (zero rejections). Invisible locally, where this step
          # was re-run as a function without -e. The replica (tools/ci-replica.sh) runs steps with -e and found it.
          rejected="$($DC logs worker 2>&1 | grep -c 'register rejected: unauthenticated' || true)"
          echo "worker: running=$running RestartCount=$rc registered=$registered register_rejections=$rejected"
          if [ "$registered" != "1" ] || [ "$rejected" != "0" ] || [ "$running" != "true" ] || [ "$rc" != "0" ]; then
            echo "FAIL: the worker did not register cleanly on its FIRST attempt."
            echo "register_rejections>0 means it connected before send_byo.boxes carried its"
            echo "token_hash — the seed ran late or not at all — so it was rejected as"
            echo "unauthenticated and exited. It has no restart policy, so it stays dead until"
            echo "run.sh SUITE 3 re-seeds and restarts it, and every suite before that which execs"
            echo "into it fails with EMPTY output that looks like an mTLS or a volume bug. Check the"
            echo "ordering in scripts/dev.sh's reset case."
            $DC logs worker | tail -20
            exit 1
          fi

      - name: Real-infra behavioral harness (10 checks, must be all-green)
        run: bash scripts/dev.sh test

      # #131's regression guard. Reads the RENDERED compose config in both modes (it needs no running
      # stack, only .env from `dev.sh certs`) and fails if the DEFAULT stack's Postgres is ever RAM-backed
      # again — with a built-in control that the RAM mode really does render a tmpfs, so the check cannot
      # pass on an empty render.
      - name: Durability gate — the default dev Postgres is not RAM-backed; the RAM one is opt-in (BLOCKING)
        if: always()
        run: bash tests/harness/checks/postgres_durability.sh

      # The first CI run on a real runner died because the Control (uid 10001) could not read a 600 key owned by the
      # runner user — invisible on Docker Desktop, whose bind mounts ignore POSIX ownership. `dev.sh certs` now chowns
      # each key to its container uid (mode stays 600); this gate READS each key as that uid and, as the paired
      # control, requires that the other uids CANNOT — so it fails if someone "fixes" a permission error by chmod'ing.
      - name: Secret ownership gate — each dev key is readable by its container uid only, mode 600 (BLOCKING)
        if: always()
        run: bash tests/harness/checks/secret_ownership.sh

      - name: Drift gate — config reference vs seeded send_byo.config (BLOCKING)
        if: always()
        run: bash tests/harness/checks/config_drift.sh

      - name: Drift gate — served routes vs api-contract.md (BLOCKING)
        if: always()
        run: bash tests/harness/checks/contract_drift.sh

      - name: Drift gate — migration chain lint (BLOCKING)
        if: always()
        run: bash tests/harness/checks/migration_lint.sh

      - name: Consumption gate — every seeded config key has a real consumer or is RESERVED (BLOCKING)
        if: always()
        run: bash tests/harness/checks/config_consumption.sh

      # The PAIRED CONTROL for the step above. It is a separate step, not folded into the gate, so a
      # failure names which of the two broke. It is BLOCKING and load-bearing: with
      # score_alert_threshold dropped at send_byo_0051 the real ledger has ZERO RESERVED keys, so
      # config_consumption.sh's entire expiry branch is dead code on this tree — it prints OK for 84
      # keys without evaluating a single expiry. Without this step, the withdrawal of the FW-M3-N form
      # could be deleted and the gate would still pass on every run, forever. Needs no database or
      # stack (it builds a throwaway repo skeleton in a temp dir), which is why it sits with the
      # static gates rather than the harness.
      - name: Consumption gate SELF-TEST — the RESERVED-expiry branch the real ledger no longer reaches (BLOCKING)
        if: always()
        run: bash tests/harness/checks/config_consumption_selftest.sh

      # The META-GATE: it checks that the other gates and the test suites are actually WIRED.
      # Twice this repo has had work that was written, passing, and executed by nothing (httpapi's
      # first test file; config_consumption_selftest.sh plus four more packages found in the audit
      # after it). run.sh has warned about this in prose since the first incident and four packages
      # accumulated behind the warning anyway — a warning comment is not a control. This step is the
      # control. Needs no stack.
      - name: Enumeration meta-gate — every test package and gate script is actually wired (BLOCKING)
        if: always()
        run: bash tests/harness/checks/test_enumeration.sh

      - name: Enumeration meta-gate SELF-TEST — the paired control (BLOCKING)
        if: always()
        run: bash tests/harness/checks/test_enumeration_selftest.sh

      # The harness judges every Go package through go_suite. Its verdict used to be `echo "$out" | grep -q` under pipefail,
      # which reports a REAL early `--- FAIL` as absent once the verbose output outgrows a pipe buffer: a failing package
      # recorded as PASSING. This runs the real go_suite against a throwaway failing package (and a passing one, so a
      # reject-everything go_suite cannot satisfy it). Needs only Go.
      - name: Harness SELF-TEST — go_suite records a failing Go package as FAILED and says why (BLOCKING)
        if: always()
        run: bash tests/harness/checks/go_suite_selftest.sh

      # No floating image reference anywhere (no `:latest`, no untagged image), and the harness's own dependencies (Mailpit,
      # CoreDNS, the DNS black-hole fixture) pinned by DIGEST. A cold pull on a runner gets whatever the registry serves that day
      # while a developer's machine keeps an old cached copy; the CI replica held CoreDNS 1.14.6 while the runner pulled 1.15.0.
      # Static; needs no stack.
      - name: Image pins — no floating tag, and the harness's images are pinned by digest (BLOCKING)
        if: always()
        run: bash tests/harness/checks/image_pins.sh

      - name: Image pins SELF-TEST — the gate rejects each way a pin can be lost (BLOCKING)
        if: always()
        run: bash tests/harness/checks/image_pins_selftest.sh

      # M3-CI-OD-1 (ruled 2026-11-08). The From-gate's DNS handling must not depend on the host's resolv.conf: Go's
      # resolver walks a `search` list and returns the LAST name's error, so a SERVFAIL used to become an NXDOMAIN and
      # a DNS outage read as "no records". The dev host has no search domain; a GitHub runner does, which is the only
      # reason this was ever seen. This runs every fromgate test inside a container whose resolv.conf carries one.
      - name: DNS search-domain fixture — the From-gate behaves the same under a resolv.conf search domain (BLOCKING)
        if: always()
        run: bash tests/harness/checks/dns_search_domain.sh

      # Its PAIRED CONTROL: the same fixture against a build with name-rooting disabled must go RED in T5, with the
      # collapse signature, while the canary stays green. Keeps "this fixture reds without the fix" true on every run.
      - name: DNS search-domain fixture SELF-TEST — the fixture goes RED when name-rooting is disabled (BLOCKING)
        if: always()
        run: bash tests/harness/checks/dns_search_domain_selftest.sh

      # FW-M3-22. The daily-limit ceiling is defended under FORCED contention: a consume parked on a test-held gate while it
      # holds the last slot (observed in pg_stat_activity), seven peers that must all be refused with capacity visibly
      # remaining. This is the real code, once, with the evidence line required. The 50-run proof is the manually-dispatched
      # consume-contention-repeat workflow.
      - name: Consume contention — the daily-limit ceiling under FORCED contention (BLOCKING)
        if: always()
        run: bash tests/harness/checks/consume_contention.sh

      # Its PAIRED CONTROLS: six mutants (SKIP LOCKED removed, consume serialised, ceiling removed, gate disarmed — and, for the MVCC re-check test, row lock removed and its gate disarmed) must each
      # turn the test it targets red with its own signature. Keeps "the test reds without the property" true on every run.
      - name: Consume contention SELF-TEST — six mutants each go RED (BLOCKING)
        if: always()
        run: bash tests/harness/checks/consume_contention_selftest.sh

      - name: Shutdown gate — SIGTERM grace clears shutdown_drain_timeout_sec (BLOCKING)
        if: always()
        run: bash tests/harness/checks/drain_grace.sh

      - name: Security gate — no credential leak in service logs (BLOCKING)
        if: always()
        run: bash tests/harness/checks/no_secret_leak.sh

      # N1/D12's WIRING control. internal/dsnscrub's nine tests prove the scrub works; they cannot
      # prove it is CALLED. Measured: with the wrap removed from internal/db's call sites, the unit
      # package stayed green and so did go build and go vet — nothing in the toolchain notices a
      # leaking call site. This gate is the thing that notices. It needs no database or stack (it is
      # static analysis over services/ and tools/), so it sits with the other structural gates.
      - name: Security gate — every driver call site scrubs the DSN out of its error (BLOCKING)
        if: always()
        run: bash tests/harness/checks/dsn_scrub_wiring.sh

      - name: Scrub gate — last_smtp_response has one reader, last_error_message has zero readers in platformapi/ (BLOCKING)
        if: always()
        run: bash tests/harness/checks/user_output_scrub.sh

      # FW-M3-21 (ruled by M3-P8-OD-3, built 2026-11-14). Every string a user reads is in Docs/user-copy-strings.txt and has a verdict in
      # Docs/user-facing-copy.md, and every ledger row is a string some code site renders (a `// copy-ledger: <id>` marker); any prose literal
      # in a file that renders copy without a marker fails. It does NOT check that a row's evidence is TRUE — that stays a human judgment.
      - name: User-copy ledger — code markers, ledger and audit document are the same set; no unledgered prose (BLOCKING)
        if: always()
        run: bash tests/harness/checks/user_copy_ledger.sh

      # Its PAIRED CONTROL: six deliberate breaks of a scratch copy (a row deleted, a sentence added, an orphan row, a verdict deleted,
      # a marker deleted, a placeholder for evidence) must each turn the gate red with their own signature.
      - name: User-copy ledger SELF-TEST — six breaks each go RED (BLOCKING)
        if: always()
        run: bash tests/harness/checks/user_copy_ledger_selftest.sh

      # Phase 3 close-out C3 (the two-vocabulary rule on the two routes that put a code in a 200 body). No response field of the account test button or of
      # bulk-add may carry raw error text: the route files are parsed, every place a response field is set is classified, and the run fails if a string
      # field can be assigned from err.Error(), a formatted string, a concatenation, the internal reason, or anything outside its closed set (user_codes.go).
      # It has a nonzero floor on the fields it found and fails on a rule that matches no site. The DB-backed half (every internal failure path forced, every
      # string in the body asserted against its closed set) is response_closed_vocabulary_test.go in the platformapi suite.
      - name: Response leak gate — no response field of the test button or bulk-add can carry raw error text (BLOCKING)
        if: always()
        run: bash tests/harness/checks/response_leak_gate.sh

      # Its PAIRED CONTROL: five one-line breaks of a scratch copy (err.Error() in a field, the internal reason as a row code, a concatenation, a literal
      # outside the closed set, a new field with no rule) must each turn the gate red with their own signature.
      - name: Response leak gate SELF-TEST — five breaks each go RED (BLOCKING)
        if: always()
        run: bash tests/harness/checks/response_leak_gate_selftest.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f tests/harness/compose.test.yml ps || true
          docker compose -f docker-compose.yml -f tests/harness/compose.test.yml logs control worker migrate || true

      - name: Tear down
        if: always()
        run: bash scripts/dev.sh down || true

  # E11 (single-Control throughput-ceiling LOAD test) is a before-you-SCALE gate, NOT a
  # per-push blocker (Phase 9.5 §7). It runs on demand, not here:
  #   workflow_dispatch -> bash scripts/dev.sh test suites/load   (added when E11 lands)
